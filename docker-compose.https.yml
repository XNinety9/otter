# HTTPS with Caddy in front of Otter. Layer it on top of docker-compose.yml:
#   OTTER_DOMAIN=otter.lan docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
# See "HTTPS" in the README (LAN certificates, Let's Encrypt, devices).
services:
  otter:
    # Only reachable through Caddy: a published plain-HTTP port would bypass TLS.
    ports: !reset []
    environment:
      # Trust X-Forwarded-* (scheme, client address) from Caddy. Safe here because Otter's
      # port isn't published; never set this when Otter is directly reachable.
      FORWARDED_ALLOW_IPS: "*"
      OTTER_PUBLIC_URL: ${OTTER_PUBLIC_URL:-https://${OTTER_DOMAIN:?set OTTER_DOMAIN to the name devices and browsers use}}

  caddy:
    image: caddy:2.11
    depends_on: [otter]
    ports:
      - "${OTTER_HTTP_PORT:-80}:80"
      - "${OTTER_HTTPS_PORT:-443}:443"
    environment:
      OTTER_DOMAIN: ${OTTER_DOMAIN:?set OTTER_DOMAIN to the name devices and browsers use}
      OTTER_TLS: ${OTTER_TLS:-internal}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data  # certificates, and the local CA devices must trust
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
