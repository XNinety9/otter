name: Website

# Builds the website (site/ plus docs rendered from README.md and docs/) on pull requests,
# and publishes it to GitHub Pages from dev.
on:
  push:
    branches: [dev]
    paths: ["site/**", "README.md", "docs/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "README.md", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install markdown==3.11 pymdown-extensions==12.1
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
