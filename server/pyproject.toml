[project]
name = "otter"
version = "0.1.0"
description = "Fleet tracking and OTA updates for home-made IoT devices"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "alembic>=1.20.0",
    "prometheus-client>=0.26.0",
    "argon2-cffi>=25.1.0",
    "paho-mqtt>=2.1.0",
    "cryptography>=50.0.1",
    "zeroconf>=0.151.5",
    "pyelftools>=0.33",
    "detools>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
