<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Otter · Log in</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login">
    <img src="logo-mark.png" alt="" width="88" height="88">
    <h1>Otter</h1>
    <form id="login-form" class="card">
      <label>Username <input name="username" autocomplete="username" required autofocus></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" role="alert" hidden></p>
      <button class="primary" type="submit">Log in</button>
    </form>
    <div class="setup card" hidden>
      <strong>No account yet.</strong> Create the first one on the server:
      <pre>cd server && uv run python -m otter.cli create-user admin</pre>
      or, with Docker:
      <pre>docker compose exec otter python -m otter.cli create-user admin</pre>
    </div>
  </main>
  <script src="login.js"></script>
</body>
</html>
