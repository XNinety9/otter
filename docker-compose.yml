# Otter server. Firmware images and the SQLite database live in the `otter-data` volume.
#   docker compose up -d        then open http://<host>:8000
services:
  otter:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      OTTER_CHECKIN_INTERVAL: ${OTTER_CHECKIN_INTERVAL:-30}
      # Shared secret devices send in X-Otter-Key (empty = no check, LAN only!).
      OTTER_FLEET_KEY: ${OTTER_FLEET_KEY:-}
      # 1: new devices wait for an approval in the dashboard before they can check in.
      OTTER_DEVICE_APPROVAL: ${OTTER_DEVICE_APPROVAL:-}
      # Refuse firmware not signed with this public key (PEM content): see "Signed firmware".
      OTTER_SIGNING_PUBLIC_KEY: ${OTTER_SIGNING_PUBLIC_KEY:-}
      # Base URL devices use to download firmware, if the host header isn't reliable.
      OTTER_PUBLIC_URL: ${OTTER_PUBLIC_URL:-}
      # Notification targets (ntfy, Discord, webhooks): see "Notifications" in the README.
      OTTER_NOTIFY_URLS: ${OTTER_NOTIFY_URLS:-}
      OTTER_NOTIFY_OFFLINE_MINUTES: ${OTTER_NOTIFY_OFFLINE_MINUTES:-10}
      # Home Assistant over MQTT discovery: see "Home Assistant" in the README.
      OTTER_MQTT_URL: ${OTTER_MQTT_URL:-}
      OTTER_MQTT_INSTALL: ${OTTER_MQTT_INSTALL:-}
      # 1: advertise the server over mDNS for devices built without OTTER_SERVER. Needs the
      # host network (network_mode: host): multicast doesn't leave the default bridge.
      OTTER_MDNS: ${OTTER_MDNS:-}
    volumes:
      - otter-data:/data
    restart: unless-stopped

volumes:
  otter-data:
