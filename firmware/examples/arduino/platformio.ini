; Otter agent example for Arduino, on ESP8266 or ESP32.
; Wi-Fi and server come from environment variables at build time:
;   export WIFI_SSID=... WIFI_PASS=... OTTER_SERVER=http://192.168.1.10:8000
;   pio run -e esp8266 -t upload -t monitor

[env]
; Firmware version reported to Otter: bump it before building an update,
; or set OTTER_VERSION in the environment (tools/release.sh and CI do).
custom_otter_version = 1.0.0
extra_scripts = pre:version.py
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../../arduino/Otter
build_flags =
    '-DWIFI_SSID="${sysenv.WIFI_SSID}"'
    '-DWIFI_PASS="${sysenv.WIFI_PASS}"'
    '-DOTTER_SERVER="${sysenv.OTTER_SERVER}"'
    '-DOTTER_FLEET_KEY="${sysenv.OTTER_FLEET_KEY}"'

[env:esp8266]
platform = espressif8266 @ 4.2.1
board = d1_mini

[env:esp32]
platform = espressif32 @ 7.1.3
board = esp32dev
