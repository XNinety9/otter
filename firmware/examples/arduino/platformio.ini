; Otter agent example for Arduino, on ESP8266 or ESP32. See docs/firmware.md.
; Wi-Fi and server come from environment variables at build time (plus OTTER_FLEET_KEY,
; OTTER_CA_CERT, OTTER_SIGNING_PUBKEY, OTTER_VERSION: see the ESP-IDF example's platformio.ini):
;   export WIFI_SSID=... WIFI_PASS=... OTTER_SERVER=http://192.168.1.10:8000
;   pio run -e esp8266 -t upload -t monitor

[env]
; [ADAPT] The firmware version reported to Otter: bump it before building an update,
; or set OTTER_VERSION in the environment (tools/release.sh and CI do).
custom_otter_version = 1.0.0
extra_scripts = pre:version.py, post:../../scripts/factory_image.py
framework = arduino
monitor_speed = 115200
; The Otter library. In your own project: a copy of firmware/arduino/Otter, or its path.
lib_deps = symlink://../../arduino/Otter
build_flags =
    '-DWIFI_SSID="${sysenv.WIFI_SSID}"'
    '-DWIFI_PASS="${sysenv.WIFI_PASS}"'
    '-DOTTER_SERVER="${sysenv.OTTER_SERVER}"'
    '-DOTTER_FLEET_KEY="${sysenv.OTTER_FLEET_KEY}"'

; [ADAPT] One environment per board, listed in firmware/apps.json with Otter's hardware name.
[env:esp8266]
platform = espressif8266 @ 4.2.1
board = d1_mini

; ESP8266 with 1 MB of flash (ESP-01S…). An update is written after the running sketch, so
; the sketch area must hold both: no filesystem, which leaves ~1 MB instead of ~760 KB.
[env:esp8266-1m]
platform = espressif8266 @ 4.2.1
board = esp01_1m
board_build.ldscript = eagle.flash.1m.ld
; Boards with a USB serial chip reset into the bootloader over DTR/RTS (esp01_1m assumes none).
upload_resetmethod = nodemcu
; Its own hardware name in Otter: an ESP8266 refuses images built for another flash size.
build_flags =
    ${env.build_flags}
    '-DOTTER_HW="esp8266-1m"'

[env:esp32]
platform = espressif32 @ 7.1.3
board = esp32dev
