; Otter agent example for the ESP32 family with ESP-IDF. See docs/firmware.md.
;
; Build-time settings come from environment variables (keep them out of git: firmware/.env is
; ignored), all optional:
;   WIFI_SSID, WIFI_PASS     the network; without them, the one saved on the device, or Improv
;   OTTER_SERVER             e.g. http://192.168.1.10:8000; without it, found over mDNS
;   OTTER_FLEET_KEY          the server's fleet key, to enroll
;   OTTER_CA_CERT            the CA of an https:// server with a private CA (PEM or path)
;   OTTER_SIGNING_PUBKEY     only accept updates signed with this key (tools/release.sh sets it)
;   OTTER_VERSION            the version (else CMakeLists.txt's)
;
;   export WIFI_SSID=... WIFI_PASS=... OTTER_SERVER=http://192.168.1.10:8000
;   pio run -e esp32c6 -t upload -t monitor

[env]
platform = espressif32 @ 7.1.3
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    '-DWIFI_SSID="${sysenv.WIFI_SSID}"'
    '-DWIFI_PASS="${sysenv.WIFI_PASS}"'
    '-DOTTER_SERVER="${sysenv.OTTER_SERVER}"'
    '-DOTTER_FLEET_KEY="${sysenv.OTTER_FLEET_KEY}"'

; [ADAPT] One environment per board you build for: set its PlatformIO board, and list it in
; firmware/apps.json with Otter's hardware name (the chip: esp32, esp32c3, esp32c6…).
[env:esp32]
board = esp32dev

[env:esp32c6]
board = esp32-c6-devkitc-1

; A battery device: deep sleep between one-shot check-ins (app "otter-sleepy").
[env:esp32c6-sleepy]
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -DOTTER_DEMO_SLEEP_S=60
