; Otter agent example for the ESP32 family with ESP-IDF.
; Wi-Fi and server come from environment variables at build time:
;   export WIFI_SSID=... WIFI_PASS=... OTTER_SERVER=http://192.168.1.10:8000
;   pio run -e esp32c6 -t upload -t monitor

[env]
platform = espressif32 @ 7.1.3
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    '-DWIFI_SSID="${sysenv.WIFI_SSID}"'
    '-DWIFI_PASS="${sysenv.WIFI_PASS}"'
    '-DOTTER_SERVER="${sysenv.OTTER_SERVER}"'
    '-DOTTER_FLEET_KEY="${sysenv.OTTER_FLEET_KEY}"'

[env:esp32]
board = esp32dev

[env:esp32c6]
board = esp32-c6-devkitc-1
